<!-- Skeleton loader - shows immediately while React loads -->
<div id="skeleton-loader" class="fixed inset-0 bg-black bg-opacity-60 backdrop-blur-sm flex items-center justify-center p-4 safe-area-inset">
    <div class="max-w-4xl w-full text-center">
        <!-- Skeleton title -->
        <div class="skeleton-title mb-4" style="
            width: min(600px, 90vw);
            height: clamp(80px, 15vw, 120px);
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
            border-radius: 8px;
            margin: 0 auto;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 4px 16px rgba(31, 38, 135, 0.2);
        "></div>
        
        <!-- Skeleton subtitle -->
        <div class="skeleton-subtitle mb-8" style="
            width: min(400px, 80vw);
            height: clamp(40px, 10vw, 60px);
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite 0.2s;
            border-radius: 8px;
            margin: 0 auto;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 4px 16px rgba(31, 38, 135, 0.2);
        "></div>
        
        <!-- Skeleton dog selection -->
        <div class="skeleton-dogs mb-8" style="
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 1rem;
            padding: 24px;
            max-width: 512px;
            margin: 0 auto;
            box-shadow: 0 4px 16px rgba(31, 38, 135, 0.2);
        ">
            <div style="
                width: min(200px, 60vw);
                height: clamp(20px, 5vw, 24px);
                background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.05) 75%);
                background-size: 200% 100%;
                animation: shimmer 2s infinite 0.4s;
                border-radius: 4px;
                margin: 0 auto 16px auto;
                border: 1px solid rgba(255, 255, 255, 0.08);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                box-shadow: 0 2px 8px rgba(31, 38, 135, 0.15);
            "></div>
            <div class="grid grid-cols-3 gap-3">
                <div style="
                    height: 120px;
                    background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.05) 75%);
                    background-size: 200% 100%;
                    animation: shimmer 2s infinite 0.6s;
                    border-radius: 8px;
                    border: 1px solid rgba(255, 255, 255, 0.08);
                    backdrop-filter: blur(12px);
                    -webkit-backdrop-filter: blur(12px);
                    box-shadow: 0 2px 8px rgba(31, 38, 135, 0.15);
                "></div>
                <div style="
                    height: 120px;
                    background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.05) 75%);
                    background-size: 200% 100%;
                    animation: shimmer 2s infinite 0.8s;
                    border-radius: 8px;
                    border: 1px solid rgba(255, 255, 255, 0.08);
                    backdrop-filter: blur(12px);
                    -webkit-backdrop-filter: blur(12px);
                    box-shadow: 0 2px 8px rgba(31, 38, 135, 0.15);
                "></div>
                <div style="
                    height: 120px;
                    background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.05) 75%);
                    background-size: 200% 100%;
                    animation: shimmer 2s infinite 1s;
                    border-radius: 8px;
                    border: 1px solid rgba(255, 255, 255, 0.08);
                    backdrop-filter: blur(12px);
                    -webkit-backdrop-filter: blur(12px);
                    box-shadow: 0 2px 8px rgba(31, 38, 135, 0.15);
                "></div>
            </div>
        </div>
        
        <!-- Skeleton buttons -->
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <div style="
                width: min(180px, 40vw);
                height: clamp(50px, 12vw, 72px);
                background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.05) 75%);
                background-size: 200% 100%;
                animation: shimmer 2s infinite 1.2s;
                border-radius: 12px;
                border: 1px solid rgba(255, 255, 255, 0.08);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                box-shadow: 0 4px 16px rgba(31, 38, 135, 0.2);
            "></div>
            <div style="
                width: min(180px, 40vw);
                height: clamp(50px, 12vw, 72px);
                background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.05) 75%);
                background-size: 200% 100%;
                animation: shimmer 2s infinite 1.4s;
                border-radius: 12px;
                border: 1px solid rgba(255, 255, 255, 0.08);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                box-shadow: 0 4px 16px rgba(31, 38, 135, 0.2);
            "></div>
        </div>
    </div>
</div>
