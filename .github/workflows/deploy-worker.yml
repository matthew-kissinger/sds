name: Deploy Worker

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character Git SHA to deploy
        required: true
        type: string

concurrency:
  group: worker-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-worker:
    name: Deploy exact Worker commit
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Verify exact source commit
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be a full 40-character Git SHA." >&2
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha,,}" != "${REQUESTED_SHA,,}" ]]; then
            echo "Checked out $actual_sha, expected $REQUESTED_SHA." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$actual_sha" origin/main; then
            echo "$actual_sha is not contained in origin/main." >&2
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - run: npm ci
      - run: npm ci
        working-directory: worker
      - run: npm run typecheck
        working-directory: worker
      - run: npx vitest run tests/worker/v3-score-partition.spec.ts

      - name: Deploy Worker without migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      - name: Verify public read paths
        run: |
          node -e "fetch('https://sds-worker.matt-m-kissinger.workers.dev/healthz').then(r=>{if(!r.ok)throw new Error('healthz '+r.status);return r.text()}).then(console.log)"
          node -e "fetch('https://sds-worker.matt-m-kissinger.workers.dev/api/leaderboard?mode=solo&scene=field-v3&sheepCount=25&limit=1').then(r=>{if(!r.ok)throw new Error('field-v3 '+r.status);return r.text()}).then(console.log)"
