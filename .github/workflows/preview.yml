name: Pages Preview

on:
  pull_request:
    branches: [main]

concurrency:
  group: pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  preview-worker:
    name: Deploy isolated score preview
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.CF_PREVIEW_D1_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --prefix worker
      - name: Bind the preview D1 database
        env:
          PREVIEW_D1_ID: ${{ vars.CF_PREVIEW_D1_ID }}
        run: |
          set -euo pipefail
          sed -i "s/00000000-0000-0000-0000-000000000000/$PREVIEW_D1_ID/" worker/wrangler.toml
          if grep -q "00000000-0000-0000-0000-000000000000" worker/wrangler.toml; then
            echo "Preview D1 placeholder substitution failed." >&2
            exit 1
          fi
      - name: Migrate preview D1 only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_TARGET: preview
        run: node scripts/d1-migrate-remote.mjs
      - name: Deploy preview Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --env preview
      - name: Verify preview identity and solo times
        run: |
          node -e "fetch('https://sds-worker-preview.matt-m-kissinger.workers.dev/healthz').then(r=>{if(!r.ok)throw new Error('healthz '+r.status);return r.text()}).then(console.log)"
          node -e "fetch('https://sds-worker-preview.matt-m-kissinger.workers.dev/api/leaderboard?mode=solo&scene=field-v3&sheepCount=25&limit=1').then(r=>{if(!r.ok)throw new Error('field-v3 '+r.status);return r.text()}).then(console.log)"
          node -e "fetch('https://sds-worker-preview.matt-m-kissinger.workers.dev/api/register',{method:'POST',headers:{'content-type':'application/json'},body:'{}'}).then(r=>{if(!r.ok)throw new Error('register '+r.status);return r.text()}).then(console.log)"

  pages-preview:
    name: Build and deploy Pages preview
    needs: preview-worker
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix worker
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm run typecheck:worker
      - run: npm run build
        env:
          SDS_RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
          SDS_RELEASE_REF: refs/pull/${{ github.event.pull_request.number }}/head
          VITE_SCORE_API_BASE: https://sds-worker-preview.matt-m-kissinger.workers.dev
      - run: npm run check:discovery
      - run: npm test --if-present
      - name: Write preview release identity
        env:
          SDS_RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
          SDS_RELEASE_REF: refs/pull/${{ github.event.pull_request.number }}/head
        run: |
          node scripts/write-release-manifest.mjs
          node scripts/verify-release-manifest.mjs --path dist/release.json --sha "$SDS_RELEASE_SHA"
      - name: Deploy Pages preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sds-frontend --branch=${{ github.head_ref }} --commit-hash=${{ github.event.pull_request.head.sha }}
