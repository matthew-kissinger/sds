name: Preview

# Each pull request uploads a version of the preview Worker, sds-worker-preview,
# under the stable alias pr-<number>. The alias serves that build's game and
# API on one origin against the preview environment's own D1 and JWT_SECRET:
#   https://pr-<number>-sds-worker-preview.matt-m-kissinger.workers.dev
# It never uploads a version of production: a version preview of sds-worker
# would share production's D1 and secrets.
#
# RELEASE 2 STAGE B (STATUS.md). This workflow is the `cf` CLI's attempt on
# the preview Worker: the Build Output the Cloudflare Vite plugin 2.0 writes
# from app/cloudflare.config.ts is what `cf` uploads, with `--prebuilt` so the
# build stays this repository's own `npm run build:preview`. Besides the
# aliased version it also DEPLOYS the version to the preview Worker, which the
# wrangler path never did, so that Stage B's second and third checks (bindings
# and route list; the Durable Object migration tag across a wrangler deploy of
# an older commit and a rollback) can be read from a live `cf`-made deployment.
# Production stays on wrangler (deploy.yml) until the four checks pass.

on:
  pull_request:
    branches: [main]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: Upload pull request preview
    # Dependabot pull requests do not receive repository secrets, so every step
    # below would run with an empty CF_API_TOKEN and fail in about 14 seconds.
    # Skip rather than fail: a job that cannot pass teaches people to ignore a
    # red check.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
      PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}-sds-worker-preview.matt-m-kissinger.workers.dev
      PREVIEW_ROOT_URL: https://sds-worker-preview.matt-m-kissinger.workers.dev
      BUILD_OUTPUT: app/.cloudflare/output/v0
      # `cf` keeps its own credentials; the token and account are the ones the
      # wrangler path used. Telemetry off, as for any tool in CI here.
      CF_SEND_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Acquire approved game audio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          node tools/prepare-approved-audio.mjs --download
      # No VITE_SCORE_API_BASE: the preview calls its own origin's /api, as
      # production does. The Vite mode selects the Worker that
      # app/cloudflare.config.ts returns; `preview` is sds-worker-preview.
      - name: Build the client and the preview Worker
        run: npm run build:preview
        env:
          SDS_RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
          SDS_RELEASE_REF: refs/pull/${{ github.event.pull_request.number }}/head
      - run: node scripts/verify-public-discovery.mjs --require-analytics --dist "$BUILD_OUTPUT/workers/default/assets"
      - name: Verify preview release identity
        run: node scripts/verify-release-manifest.mjs --path "$BUILD_OUTPUT/workers/default/assets/release.json" --sha "${{ github.event.pull_request.head.sha }}"
      - name: Verify the Build Output
        run: node scripts/verify-deploy-config.mjs --cf --preview

      # The script names wrangler.toml and --env preview itself; `cf` does not
      # read that file, and this step does not use `cf`. The preview database
      # id is committed in wrangler.toml and app/cloudflare.config.ts; the
      # script refuses to run against the production id.
      - name: Migrate preview D1 only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_TARGET: preview
        run: node scripts/d1-migrate-remote.mjs

      # `cf` finds app/cloudflare.config.ts by walking up from its working
      # directory, so it runs from app/. `--prebuilt` uploads the Build Output
      # verified above without building again. Dry run first: it validates the
      # output and prints the bindings it would deploy, with no API request.
      - name: Dry-run the cf upload
        working-directory: app
        run: npx cf deploy --dry-run --prebuilt --mode preview
      - name: Upload the aliased preview version with cf
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx cf workers versions create --prebuilt --mode preview --preview-alias "$PREVIEW_ALIAS" --message "${{ github.event.pull_request.head.sha }}"
      - name: Deploy the version to the preview Worker with cf
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx cf deploy --prebuilt --mode preview --message "${{ github.event.pull_request.head.sha }}"

      - name: Verify the preview's game, API and identity on the alias and on the deployed Worker
        env:
          SDS_RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node scripts/verify-worker-origin.mjs --url "$PREVIEW_URL" --sha "$SDS_RELEASE_SHA" --retries 12
          node scripts/verify-worker-origin.mjs --url "$PREVIEW_ROOT_URL" --sha "$SDS_RELEASE_SHA" --retries 12
          node scripts/verify-identity.mjs --url "$PREVIEW_URL" --save "$RUNNER_TEMP/preview-identity.json"
          node scripts/verify-identity.mjs --url "$PREVIEW_URL" --check "$RUNNER_TEMP/preview-identity.json"
          echo "Preview: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed preview Worker: $PREVIEW_ROOT_URL" >> "$GITHUB_STEP_SUMMARY"
