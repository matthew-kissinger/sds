name: Pages Preview

on:
  pull_request:
    branches: [main]

concurrency:
  group: pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  pages-preview:
    name: Build and deploy Pages preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix worker
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm run typecheck:worker
      - run: npm run build
        env:
          SDS_RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
          SDS_RELEASE_REF: refs/pull/${{ github.event.pull_request.number }}/head
          VITE_SCORE_API_BASE: https://sds-v3-static-preview.invalid
      - run: npm run check:discovery
      - run: npm test --if-present
      - name: Write preview release identity
        env:
          SDS_RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
          SDS_RELEASE_REF: refs/pull/${{ github.event.pull_request.number }}/head
        run: |
          node scripts/write-release-manifest.mjs
          node scripts/verify-release-manifest.mjs --path dist/release.json --sha "$SDS_RELEASE_SHA"
      - name: Deploy Pages preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sds-frontend --branch=${{ github.head_ref }} --commit-hash=${{ github.event.pull_request.head.sha }}
