name: Client CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: client-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-client:
    name: Verify static client
    runs-on: ubuntu-latest
    env:
      # Where the Cloudflare Vite plugin 2.0 writes the build (Release 2 Stage
      # B): the Build Output Specification under the Vite root, the game under
      # its workers/default/assets. The plugin fixes these paths; a build.outDir
      # is overridden, so nothing is written to dist/ any more.
      BUILD_OUTPUT: app/.cloudflare/output/v0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm run typecheck:worker
      - name: Acquire approved game audio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          node tools/prepare-approved-audio.mjs --download
      - run: npm run build
        env:
          SDS_RELEASE_SHA: ${{ github.sha }}
          SDS_RELEASE_REF: ${{ github.ref }}
      - run: node scripts/verify-public-discovery.mjs --require-analytics --dist "$BUILD_OUTPUT/workers/default/assets"
      - run: npm test --if-present
      # The build wrote the release manifest and the Worker's configuration itself.
      - name: Verify packaged release identity
        run: node scripts/verify-release-manifest.mjs --path "$BUILD_OUTPUT/workers/default/assets/release.json" --sha "${{ github.sha }}"
      - name: Verify the Build Output
        run: node scripts/verify-deploy-config.mjs --cf
      - uses: actions/upload-artifact@v7
        with:
          name: pages-candidate-${{ github.sha }}
          path: app/.cloudflare/output/v0/
          if-no-files-found: error
          retention-days: 14
