name: Client CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: client-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-client:
    name: Verify static client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm run typecheck:worker
      - name: Acquire approved game audio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          node tools/prepare-approved-audio.mjs --download
      - run: npm run build
        env:
          SDS_RELEASE_SHA: ${{ github.sha }}
          SDS_RELEASE_REF: ${{ github.ref }}
      - run: npm run check:discovery
      - run: npm test --if-present
      # The build wrote dist/release.json and the Worker's deploy config itself.
      - name: Verify packaged release identity
        run: node scripts/verify-release-manifest.mjs --path dist/release.json --sha "${{ github.sha }}"
      - name: Verify the generated deploy configuration
        run: node scripts/verify-deploy-config.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: pages-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
