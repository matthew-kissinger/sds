name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      capture_baseline:
        description: 'Capture perf baseline (Linux runner) and commit. Run once to bootstrap perf-check.'
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test --if-present

  e2e:
    # Cycle 9 Phase 3: smoke + WebGL probe on Chromium. Firefox/WebKit projects
    # exist in playwright.config.ts for local cross-browser runs but are NOT
    # exercised in CI: headless Linux GH runners don't ship a software WebGL
    # backend for Firefox/WebKit, so a `THREE.WebGLRenderer` failure is
    # guaranteed and not a real regression. Real cross-engine coverage runs
    # nightly via macos-safari.yml (real Safari + Metal on a macos-latest
    # runner). Run all three browsers locally with `npm run test:e2e`.
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: worker
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium --grep-invert='@local-only'
        env:
          CI: 'true'
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Apply any D1 migration newly ADDED in this push to the remote DB BEFORE the
  # worker/pages deploys, so code never ships ahead of its schema. This closes the
  # Cycle 67 gap where 0009 had to be applied to remote by hand (the survival
  # board 500'd until it was). It applies only files added in this push's commit
  # range (git diff --diff-filter=A), so already-applied migrations are never
  # re-run. The d1_migrations tracking table is historical/out-of-sync, so we do
  # NOT use `wrangler d1 migrations apply` (it would try to re-run 0007-0009).
  migrate:
    name: Migrate D1 (remote)
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - name: Apply newly-added D1 migrations to remote sds-db
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZERO="0000000000000000000000000000000000000000"
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "${ZERO}" ]; then
            BASE="${AFTER}~1"
          else
            BASE="${BEFORE}"
          fi
          echo "Scanning ${BASE}..${AFTER} for newly added worker/migrations/*.sql"
          mapfile -t NEW < <(git diff --name-only --diff-filter=A "${BASE}" "${AFTER}" -- 'worker/migrations/*.sql' | sort)
          if [ "${#NEW[@]}" -eq 0 ]; then
            echo "No new D1 migrations in this push; nothing to apply."
            exit 0
          fi
          printf 'New migration: %s\n' "${NEW[@]}"
          cd worker
          for f in "${NEW[@]}"; do
            rel="${f#worker/}"
            echo ">> Applying ${rel} to remote sds-db"
            npx wrangler d1 execute sds-db --remote --file="${rel}" --yes
          done

  pages:
    name: Deploy Pages
    needs: [test, migrate]
    if: ${{ always() && needs.test.result == 'success' && needs.migrate.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sds-frontend --branch=main --commit-hash=${{ github.sha }}

  worker:
    name: Deploy Worker
    needs: [test, migrate]
    if: ${{ always() && needs.test.result == 'success' && needs.migrate.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

  # Cycle 16 Phase 4+5: perf baseline + check. Both gated to workflow_dispatch
  # initially because a baseline must be captured on a Linux runner (per
  # cycle-16-plan.md — Linux software-WebGL through swiftshader is materially
  # slower than the local dev workstation, so baseline numbers must be Linux
  # numbers, not local numbers).
  #
  # Bootstrap workflow:
  #   1. Trigger workflow_dispatch with `capture_baseline: true` ONCE — runs
  #      perf-baseline-capture, commits tests/perf-baseline/baseline.json.
  #   2. After that, every push runs perf-check against the committed
  #      baseline. To flip from workflow_dispatch-only to push-gated, remove
  #      the `if: github.event_name == 'workflow_dispatch'` line on perf-check
  #      below.
  #   3. perf-check fails the workflow if any config exceeds +5% of baseline
  #      (`tools/perf-harness.mjs`'s built-in threshold).
  perf-baseline-capture:
    name: Perf baseline (capture on Linux runner)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_baseline == true }}
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: worker
      - run: cp worker/.dev.vars.example worker/.dev.vars
      - run: npx playwright install --with-deps chromium
      - name: Run D1 migrations (local, full set via scripts/d1-local-setup.mjs)
        run: node scripts/d1-local-setup.mjs
      - name: Start dev server (vite + wrangler) in background
        run: |
          npx vite --port 3000 > /tmp/vite.log 2>&1 &
          (cd worker && npx wrangler dev) > /tmp/wrangler.log 2>&1 &
          # Poll until vite is up (max 60s).
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "vite up after ${i}s"; break
            fi
            sleep 1
          done
      - run: npm run perf:baseline
      - name: Commit baseline if changed
        run: |
          if [ -n "$(git status --porcelain tests/perf-baseline/baseline.json)" ]; then
            git config user.name "perf-baseline-bot"
            git config user.email "perf-baseline-bot@users.noreply.github.com"
            git add tests/perf-baseline/baseline.json
            git commit -m "perf(cycle-16): capture Linux baseline via deploy.yml workflow_dispatch (swiftshader software-WebGL; +5% threshold per tools/perf-harness.mjs)"
            git push
          else
            echo "Baseline unchanged; nothing to commit."
          fi
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: perf-baseline-output
          path: tests/perf-baseline/

  perf-check:
    name: Perf check vs baseline
    runs-on: ubuntu-latest
    # Manual-only. The Linux runner's browser/graphics stack has become too
    # noisy for a release gate: it can report multi-second WebGL frames while
    # local installed-Chrome WebGPU/WebGL proofs stay inside budget. Keep this
    # harness available for explicit baseline investigations, but do not block
    # normal deploys on it.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Skip when no baseline committed yet
        id: gate
        run: |
          if [ ! -f tests/perf-baseline/baseline.json ]; then
            echo "::warning::No perf baseline at tests/perf-baseline/baseline.json. Trigger workflow_dispatch with capture_baseline=true once to bootstrap."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.skip != 'true'
        run: npm ci
      - if: steps.gate.outputs.skip != 'true'
        run: npm ci
        working-directory: worker
      - if: steps.gate.outputs.skip != 'true'
        run: cp worker/.dev.vars.example worker/.dev.vars
      - if: steps.gate.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.gate.outputs.skip != 'true'
        name: Run D1 migrations (local, full set via scripts/d1-local-setup.mjs)
        run: node scripts/d1-local-setup.mjs
      - if: steps.gate.outputs.skip != 'true'
        name: Start dev server (vite + wrangler) in background
        run: |
          npx vite --port 3000 > /tmp/vite.log 2>&1 &
          (cd worker && npx wrangler dev) > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "vite up after ${i}s"; break
            fi
            sleep 1
          done
      - if: steps.gate.outputs.skip != 'true'
        run: npm run perf:check
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: perf-last-run
          path: tests/perf-baseline/last-run.json
        continue-on-error: true
