name: Deploy

# One release, one commit, one deploy. The sds-worker Worker serves the game's
# static assets and the score API on sheepdogsim.com, so a single
# `wrangler deploy` of the configuration the build generated ships both halves
# from the same checkout.
# docs/operations/deployment.md is the procedure.

on:
  # Normal path: push an annotated release tag. The tag names the commit, so
  # there is no SHA to copy, and what shipped stays nameable for a rollback.
  push:
    tags:
      - 'v*'
  # Escape hatch: deploy any commit already on main, including an older one.
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA to deploy
        required: true
        type: string

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy exact commit to sds-worker
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sheepdogsim.com
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit_sha || github.ref }}
          fetch-depth: 0

      - name: Resolve and verify the source commit
        id: source
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          # A dispatch names the commit, so it must match exactly. A tag push
          # names it by pointing at it, so there is nothing to compare against.
          if [[ -n "$REQUESTED_SHA" ]]; then
            if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "commit_sha must be a full 40-character Git SHA." >&2
              exit 1
            fi
            if [[ "${actual_sha,,}" != "${REQUESTED_SHA,,}" ]]; then
              echo "Checked out $actual_sha, expected $REQUESTED_SHA." >&2
              exit 1
            fi
          fi
          # Either way the commit must already be on main. A tag pointing at an
          # unmerged commit does not become deployable by being a tag.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$actual_sha" origin/main; then
            echo "$actual_sha is not contained in origin/main." >&2
            exit 1
          fi
          # A commit from before the one-Worker hosting has a wrangler.toml
          # with no assets and with the v2 Durable Objects. Deploying it would
          # replace the game with a bare API and try to resurrect deleted
          # classes. Older releases roll back by deleting the route instead.
          # The configuration lives at the repository root from 3.2.1; a commit
          # from before that deploys with the workflow at its own tag (see
          # Rolling back in docs/operations/deployment.md).
          if ! grep -q '^\[assets\]' wrangler.toml; then
            echo "$actual_sha has no root wrangler.toml serving the game. See docs/operations/deployment.md, Rolling back." >&2
            exit 1
          fi
          echo "sha=$actual_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm run typecheck:worker
      - name: Acquire approved game audio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          node tools/prepare-approved-audio.mjs --download
      - run: npm run build
        env:
          SDS_RELEASE_SHA: ${{ steps.source.outputs.sha }}
          SDS_RELEASE_REF: ${{ inputs.commit_sha || github.ref_name }}
      - run: npm run check:discovery
      # The full suite, which includes tests/worker and its configuration test.
      - run: npm test --if-present

      # The build wrote dist/release.json itself; this proves it names this SHA.
      - name: Verify release identity
        run: node scripts/verify-release-manifest.mjs --path dist/release.json --sha "${{ steps.source.outputs.sha }}" --require-v3-static

      # The deploy ships exactly this generated file, so prove it carries the
      # production name, route, D1 id, migrations and an assets directory that
      # holds release.json, before anything is uploaded.
      - name: Verify the generated deploy configuration
        run: node scripts/verify-deploy-config.mjs

      - name: Archive exact release artifact
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ steps.source.outputs.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      # `wrangler deploy`, never `versions upload`: only deploy applies Durable
      # Object lifecycle migrations and the route. It deploys the configuration
      # the build generated (the Vite root is app/, so the plugin's own redirect
      # file is not used) and uploads the dist/ it names as the Worker's assets,
      # so it must run after the build above.
      - name: Deploy sds-worker with the game's assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          # --env="" is accepted with a generated config and kept from before.
          command: deploy --config .wrangler/build/sds_worker/wrangler.json --env="" --message ${{ steps.source.outputs.sha }}

      - name: Verify live release identity
        run: node scripts/verify-release-manifest.mjs --url https://sheepdogsim.com/release.json --sha "${{ steps.source.outputs.sha }}" --retries 12

      # Content types, not status codes: an unrouted sheepdogsim.com/api/*
      # answers 200 text/html from the Pages fallback.
      - name: Verify the game and API share sheepdogsim.com
        run: node scripts/verify-worker-origin.mjs --url https://sheepdogsim.com --sha "${{ steps.source.outputs.sha }}" --retries 12

      - name: Verify the workers.dev host still answers
        run: node scripts/verify-worker-origin.mjs --url https://sds-worker.matt-m-kissinger.workers.dev --sha "${{ steps.source.outputs.sha }}" --retries 12

      - name: Verify live discovery and analytics
        run: node scripts/verify-public-discovery.mjs --url https://sheepdogsim.com --require-analytics --retries 12
