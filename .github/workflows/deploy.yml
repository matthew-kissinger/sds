name: Deploy

# One release, one commit, one deploy. The sds-worker Worker serves the game's
# static assets and the score API on sheepdogsim.com, so a single
# `cf deploy --prebuilt` of the Build Output the build wrote ships both halves
# from the same checkout (Release 2 Stage B; docs/operations/deployment.md is
# the procedure). Production stayed on wrangler until the four Stage B checks
# passed on the preview Worker (docs/history/status-log.md, Release 2 Stage B).

on:
  # Normal path: push an annotated release tag. The tag names the commit, so
  # there is no SHA to copy, and what shipped stays nameable for a rollback.
  push:
    tags:
      - 'v*'
  # Escape hatch: deploy any commit already on main, including an older one.
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA to deploy
        required: true
        type: string

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy exact commit to sds-worker
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sheepdogsim.com
    env:
      # Where the Cloudflare Vite plugin writes the build (scripts/build-output.mjs):
      # the Build Output Specification under the Vite root, the game under its
      # workers/default/assets. `cf deploy --prebuilt` uploads it as it stands.
      BUILD_OUTPUT: app/.cloudflare/output/v0
      # `cf` keeps its own credentials; the token and account are the ones the
      # wrangler path used. Telemetry off, as for any tool in CI here.
      CF_SEND_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha || github.ref }}
          fetch-depth: 0

      - name: Resolve and verify the source commit
        id: source
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          # A dispatch names the commit, so it must match exactly. A tag push
          # names it by pointing at it, so there is nothing to compare against.
          if [[ -n "$REQUESTED_SHA" ]]; then
            if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "commit_sha must be a full 40-character Git SHA." >&2
              exit 1
            fi
            if [[ "${actual_sha,,}" != "${REQUESTED_SHA,,}" ]]; then
              echo "Checked out $actual_sha, expected $REQUESTED_SHA." >&2
              exit 1
            fi
          fi
          # Either way the commit must already be on main. A tag pointing at an
          # unmerged commit does not become deployable by being a tag.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$actual_sha" origin/main; then
            echo "$actual_sha is not contained in origin/main." >&2
            exit 1
          fi
          # This workflow deploys the Build Output that app/cloudflare.config.ts
          # describes. A commit from before it (3.2.1 to 3.3.0) built for
          # wrangler and deploys with the workflow at its own tag; one from
          # before the one-Worker hosting would replace the game with a bare
          # API and try to resurrect deleted Durable Object classes. See
          # Rolling back in docs/operations/deployment.md.
          if [[ ! -f app/cloudflare.config.ts ]]; then
            echo "$actual_sha has no app/cloudflare.config.ts. See docs/operations/deployment.md, Rolling back." >&2
            exit 1
          fi
          echo "sha=$actual_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm run typecheck:worker
      - name: Acquire approved game audio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          node tools/prepare-approved-audio.mjs --download
      # No --mode: app/cloudflare.config.ts returns sds-worker for the default.
      - run: npm run build
        env:
          SDS_RELEASE_SHA: ${{ steps.source.outputs.sha }}
          SDS_RELEASE_REF: ${{ inputs.commit_sha || github.ref_name }}
      - run: npm run check:discovery
      # The full suite, which includes tests/worker and its configuration tests.
      - run: npm test --if-present

      # The build wrote the release manifest itself; this proves it names this SHA.
      - name: Verify release identity
        run: node scripts/verify-release-manifest.mjs --path "$BUILD_OUTPUT/workers/default/assets/release.json" --sha "${{ steps.source.outputs.sha }}" --require-v3-static

      # The deploy ships exactly this Build Output, so prove it carries the
      # production name, the apex Custom Domain and no route, the D1 id, no
      # Durable Object export and an assets directory that holds release.json,
      # before anything is uploaded.
      - name: Verify the Build Output
        run: node scripts/verify-deploy-config.mjs --cf

      - name: Archive exact release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.source.outputs.sha }}
          path: app/.cloudflare/output/v0/
          if-no-files-found: error
          retention-days: 90

      # `cf` finds app/cloudflare.config.ts by walking up from its working
      # directory, so it runs from app/. `--prebuilt` uploads the Build Output
      # verified above without building again; `--no-provision` because every
      # binding names an existing resource and nothing may be created here. Dry
      # run first: it validates the output and prints the bindings it would
      # deploy, with no API request.
      - name: Dry-run the deploy
        working-directory: app
        run: npx cf deploy --dry-run --prebuilt --no-provision

      # `cf deploy`, never `versions create`: only a deploy publishes the
      # Custom Domain and becomes the Worker's active deployment. It uploads
      # the game as the Worker's assets and the API code as one version, so it
      # must run after the build and the checks above.
      - name: Deploy sds-worker with the game's assets
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx cf deploy --prebuilt --no-provision --message "${{ steps.source.outputs.sha }}"

      - name: Verify live release identity
        run: node scripts/verify-release-manifest.mjs --url https://sheepdogsim.com/release.json --sha "${{ steps.source.outputs.sha }}" --retries 12

      # Content types, not status codes: a sheepdogsim.com/api/* that reached
      # the asset layer instead of the Worker would answer 200 text/html.
      - name: Verify the game and API share sheepdogsim.com
        run: node scripts/verify-worker-origin.mjs --url https://sheepdogsim.com --sha "${{ steps.source.outputs.sha }}" --retries 12

      - name: Verify the workers.dev host still answers
        run: node scripts/verify-worker-origin.mjs --url https://sds-worker.matt-m-kissinger.workers.dev --sha "${{ steps.source.outputs.sha }}" --retries 12

      - name: Verify live discovery and analytics
        run: node scripts/verify-public-discovery.mjs --url https://sheepdogsim.com --require-analytics --retries 12
