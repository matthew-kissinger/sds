<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#00BFFF">
    <title>Sheep Dog Sim - Alpha</title>
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        #canvas-container {
            position: relative;
            width: 100%;
            height: 100vh;
            touch-action: none;
            overscroll-behavior: none;
        }
        
        input, button, select, textarea {
            font-size: 16px;
            -webkit-appearance: none;
            border-radius: 0;
        }
        
        .game-hud {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        .ui-panel {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(16px);
            border-radius: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 1rem;
        }
        
        .btn-primary {
            background: rgb(59, 130, 246);
            color: white;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            transition: all 0.2s;
            transform: scale(1);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        
        .btn-primary:hover {
            background: rgb(29, 78, 216);
            transform: scale(1.05);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        
        .btn-primary:active {
            transform: scale(0.95);
        }
        
        .mobile-control {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(16px);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        .mobile-control:active {
            transform: scale(0.95);
        }
        
        .stamina-bar {
            width: 100%;
            height: 0.5rem;
            background: rgb(55, 65, 81);
            border-radius: 0.25rem;
            overflow: hidden;
        }
        
        .stamina-fill {
            height: 100%;
            transition: all 0.3s ease-out;
        }
        
        /* Hide old UI initially */
        #start-screen,
        .game-ui {
            display: none;
        }
        
        /* Animation keyframes */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
            50% { box-shadow: 0 0 20px rgba(59, 130, 246, 0.8); }
        }
        
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        
        .animate-slide-up {
            animation: slideUp 0.4s ease-out;
        }
        
        .animate-pulse-glow {
            animation: pulseGlow 2s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <!-- Canvas Container for Three.js -->
    <div id="canvas-container">
        <!-- Three.js canvas will be created by SceneManager -->
    </div>
    
    <!-- React Root - UI Layer -->
    <div id="react-root" class="absolute inset-0 pointer-events-none z-50"></div>
    
    <!-- Import map for dependencies -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/",
            "stats.js": "https://cdn.jsdelivr.net/npm/stats.js@0.17.0/build/stats.min.js",
            "@geckos.io/client": "https://cdn.jsdelivr.net/npm/@geckos.io/client@3.0.2/+esm"
        }
    }
    </script>
    
    <!-- Load React dependencies -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/framer-motion@11/dist/framer-motion.js"></script>
    
    <!-- Load game first, then React -->
    <script type="module">
        // Load game first
        import('../js/main.js').then(() => {
            console.log('Game loaded, initializing React UI...');
            
            // Simple React Start Screen
            const { useState, useEffect } = React;
            const { createRoot } = ReactDOM;
            
            function StartScreen() {
                const [selectedDog, setSelectedDog] = useState('jep');
                const [showMusic, setShowMusic] = useState(true);
                const [gameStarted, setGameStarted] = useState(false);
                
                const dogs = [
                    {
                        id: 'jep',
                        name: 'Jep',
                        breed: 'Border Collie',
                        emoji: '🐕‍🦺',
                        description: 'Balanced herding specialist'
                    },
                    {
                        id: 'rauri',
                        name: 'Rauri',
                        breed: 'Australian Shepherd',
                        emoji: '🐕',
                        description: 'Powerful with extended range'
                    },
                    {
                        id: 'pip',
                        name: 'Pip',
                        breed: 'Corgi',
                        emoji: '🐶',
                        description: 'Fast and agile, short range'
                    }
                ];
                
                const handleStartGame = () => {
                    if (window.gameInstance) {
                        setGameStarted(true);
                        // Hide React UI
                        document.getElementById('react-root').style.display = 'none';
                        // Start the game
                        window.gameInstance.startGame?.('solo');
                    }
                };
                
                const enableMusic = () => {
                    setShowMusic(false);
                    try {
                        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        audioContext.resume();
                    } catch (e) {
                        console.log('Audio context not available');
                    }
                };
                
                if (gameStarted) return null;
                
                return React.createElement('div', {
                    className: 'fixed inset-0 bg-black bg-opacity-60 backdrop-blur-sm z-50 flex flex-col items-center justify-center p-4',
                    onClick: showMusic ? enableMusic : undefined
                }, [
                    // Background sheep
                    React.createElement('div', {
                        key: 'bg',
                        className: 'absolute inset-0 overflow-hidden pointer-events-none'
                    }, [
                        React.createElement('div', {
                            key: 'sheep1',
                            className: 'absolute top-10 left-10 text-4xl animate-bounce',
                            style: { animationDelay: '0s', animationDuration: '3s' }
                        }, '🐑'),
                        React.createElement('div', {
                            key: 'sheep2',
                            className: 'absolute top-20 right-20 text-4xl animate-bounce',
                            style: { animationDelay: '1s', animationDuration: '4s' }
                        }, '🐑'),
                        React.createElement('div', {
                            key: 'sheep3',
                            className: 'absolute bottom-20 left-1/4 text-4xl animate-bounce',
                            style: { animationDelay: '2s', animationDuration: '5s' }
                        }, '🐑')
                    ]),
                    
                    // Main content
                    React.createElement('div', {
                        key: 'content',
                        className: 'relative max-w-2xl w-full text-center animate-fade-in'
                    }, [
                        // Title
                        React.createElement('h1', {
                            key: 'title',
                            className: 'text-6xl md:text-8xl font-black text-blue-400 mb-4 tracking-wider animate-slide-up',
                            style: {
                                fontFamily: 'Arial Black, Arial, sans-serif',
                                textShadow: '3px 3px 0px #000',
                                textTransform: 'uppercase'
                            }
                        }, 'SHEEP DOG'),
                        
                        React.createElement('h2', {
                            key: 'subtitle',
                            className: 'text-3xl md:text-4xl font-bold text-blue-300 mb-8 animate-slide-up',
                            style: {
                                textShadow: '2px 2px 0px #000',
                                animationDelay: '0.2s'
                            }
                        }, 'SIMULATOR'),
                        
                        // Music note
                        showMusic && React.createElement('p', {
                            key: 'music',
                            className: 'text-gray-300 text-lg mb-8 italic animate-fade-in',
                            style: { animationDelay: '0.4s' }
                        }, '🎵 Click anywhere to enable music'),
                        
                        // Instructions
                        React.createElement('div', {
                            key: 'instructions',
                            className: 'ui-panel mb-8 text-left max-w-lg mx-auto animate-slide-up',
                            style: { animationDelay: '0.6s' }
                        }, [
                            React.createElement('h3', {
                                key: 'inst-title',
                                className: 'text-blue-400 text-xl font-bold mb-4 text-center'
                            }, 'How to Play'),
                            React.createElement('div', {
                                key: 'inst-list',
                                className: 'space-y-2 text-white text-opacity-90'
                            }, [
                                React.createElement('p', { key: 'inst1', className: 'flex items-center gap-2' }, 
                                    [React.createElement('span', { key: 'icon1' }, '🎯'), 'Guide all sheep into the pen using herding techniques']),
                                React.createElement('p', { key: 'inst2', className: 'flex items-center gap-2' }, 
                                    [React.createElement('span', { key: 'icon2' }, '🐕'), 'Position yourself strategically to influence sheep movement']),
                                React.createElement('p', { key: 'inst3', className: 'flex items-center gap-2' }, 
                                    [React.createElement('span', { key: 'icon3' }, '⚡'), 'Manage your stamina - sprint wisely!']),
                                React.createElement('p', { key: 'inst4', className: 'flex items-center gap-2' }, 
                                    [React.createElement('span', { key: 'icon4' }, '🏃'), 'Sheep will flee from you and flock together naturally'])
                            ])
                        ]),
                        
                        // Dog selection
                        React.createElement('div', {
                            key: 'dog-selection',
                            className: 'ui-panel animate-slide-up',
                            style: { animationDelay: '0.8s' }
                        }, [
                            React.createElement('h3', {
                                key: 'dog-title',
                                className: 'text-center text-blue-400 text-xl font-bold mb-6'
                            }, 'Choose Your Dog'),
                            React.createElement('div', {
                                key: 'dog-cards',
                                className: 'grid grid-cols-1 md:grid-cols-3 gap-4'
                            }, dogs.map((dog, index) => 
                                React.createElement('div', {
                                    key: dog.id,
                                    className: `p-4 rounded-xl border-2 cursor-pointer transition-all duration-300 ${
                                        selectedDog === dog.id 
                                            ? 'border-blue-400 bg-blue-500 bg-opacity-20 shadow-lg' 
                                            : 'border-white border-opacity-20 bg-white bg-opacity-10 hover:border-white hover:border-opacity-40'
                                    }`,
                                    onClick: () => setSelectedDog(dog.id)
                                }, [
                                    React.createElement('div', {
                                        key: 'avatar',
                                        className: 'text-center mb-3'
                                    }, [
                                        React.createElement('div', {
                                            key: 'emoji',
                                            className: 'text-5xl mb-2'
                                        }, dog.emoji),
                                        React.createElement('h4', {
                                            key: 'name',
                                            className: 'text-xl font-bold text-white'
                                        }, dog.name),
                                        React.createElement('p', {
                                            key: 'breed',
                                            className: 'text-blue-300 text-sm font-medium'
                                        }, dog.breed)
                                    ]),
                                    React.createElement('p', {
                                        key: 'desc',
                                        className: 'text-white text-opacity-80 text-sm text-center'
                                    }, dog.description)
                                ])
                            ))
                        ]),
                        
                        // Start button
                        React.createElement('button', {
                            key: 'start-btn',
                            className: 'btn-primary text-xl py-4 px-8 mt-8 animate-pulse-glow',
                            onClick: handleStartGame,
                            style: { animationDelay: '1s' }
                        }, [
                            React.createElement('span', { key: 'icon', className: 'mr-2' }, '🎮'),
                            'Start Game'
                        ]),
                        
                        // Platform hints
                        React.createElement('div', {
                            key: 'hints',
                            className: 'mt-6 text-white text-opacity-70 text-sm animate-fade-in',
                            style: { animationDelay: '1.2s' }
                        }, 'Use WASD to move • Shift to sprint • Mouse to look around')
                    ])
                ]);
            }
            
            // Mount React app
            const container = document.getElementById('react-root');
            const root = createRoot(container);
            root.render(React.createElement(StartScreen));
        });
    </script>
</body>
</html>
