name = "sds-worker"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# Observability
[observability]
enabled = true

# Durable Object class history. The version 2 multiplayer classes were created
# by v1 and retired by v2 in Release 1, which deletes the classes and their
# stored room state. Both entries stay: migrations are an append-only history
# replayed against the tag a script has already applied. They are top-level, so
# they apply to every environment. A class lifecycle change only lands through
# `wrangler deploy`; `wrangler versions upload` refuses it, and no rollback can
# cross it. Multiplayer returns as a separate realtime Worker under
# spec/03-multiplayer.md.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO", "LobbyDO"]

[[migrations]]
tag = "v2"
deleted_classes = ["RoomDO", "LobbyDO"]

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "sds-db"
database_id = "513aa937-e60a-4fb6-b499-9f3814149e88"

# Route bindings for the custom domain. DNS has been configured since the v3
# cutover; these stay commented out deliberately, not pending.
#
# Enabling them REQUIRES adding `workers_dev = true` as a top-level key in the
# same change. Cloudflare infers `workers_dev` as false once a config declares
# routes, which would take sds-worker.matt-m-kissinger.workers.dev offline - the
# origin every already-built client calls, because PROD_SCORE_API_BASE is baked
# into the bundle.
#
# Note also that sheepdogsim.com/api/* already answers 200 today: that is the
# Pages SPA fallback returning index.html, not this Worker. Verify a route took
# effect by asserting Content-Type: application/json, never the status code.
#
# See docs/operations/deployment.md.
# [[routes]]
# pattern = "sheepdogsim.com/api/*"
# zone_name = "sheepdogsim.com"
#
# [[routes]]
# pattern = "sheepdogsim.com/r/*"
# zone_name = "sheepdogsim.com"

# ---------------------------------------------------------------------------
# P2-STAGING: per-PR preview environment. Deployed by
# .github/workflows/preview.yml as sds-worker-preview, with its OWN D1 so a
# preview can never touch the production leaderboard.
#
# !!! The database_id below is a PLACEHOLDER (all zeros), not a real database.
# !!! The preview workflow substitutes the repo Actions variable
# !!! CF_PREVIEW_D1_ID before deploying, and scripts/d1-migrate-remote.mjs
# !!! refuses to run against the placeholder or the production id.
# Operator setup (one time):
#   1. npx wrangler d1 create sds-db-preview
#   2. Set repo Actions variable CF_PREVIEW_D1_ID to the new database id
#      (until it is set, the preview-worker job is skipped with a notice).
#   3. npx wrangler secret put JWT_SECRET --env preview
# Environments do not inherit bindings, so D1 is redeclared here. The Durable
# Object [[migrations]] history above is top-level and shared.
# ---------------------------------------------------------------------------
[env.preview]
name = "sds-worker-preview"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "sds-db-preview"
database_id = "00000000-0000-0000-0000-000000000000" # PLACEHOLDER - see above
