<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SDS bake-trees harness</title>
<style>body { font-family: sans-serif; padding: 1rem; color: #ccc; background: #1a1a1a; }</style>
</head>
<body>
<h1>SDS bake-trees</h1>
<p id="status">Loading EZ-Tree…</p>
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
// Cycle 91: ez-tree main-branch build served from the sibling clone
// (../ez-tree, pinned commit recorded in bake-trees.mjs). Main externalizes
// textures: the caller supplies bark.maps / leaves.map as THREE.Texture
// instances, which is what lets the bake choose real PBR bark and a
// deliberate leaf-texture resolution instead of the 1.1.0 bundled assets.
import { Tree } from '/ez-tree/build/ez-tree.es.js';

const status = document.getElementById('status');

/**
 * Apply nested tweaks to a TreeOptions object.
 *   { branch: { length: { 0: 25 } }, leaves: { count: 24 } }
 * deep-merges into tree.options without nuking siblings.
 */
function applyTweaks(target, tweaks) {
    for (const [key, val] of Object.entries(tweaks)) {
        if (val !== null && typeof val === 'object' && !Array.isArray(val)) {
            if (typeof target[key] !== 'object' || target[key] === null) target[key] = {};
            applyTweaks(target[key], val);
        } else {
            target[key] = val;
        }
    }
}

/**
 * Fetch an image and downscale it onto a canvas. Returns a CanvasTexture
 * (GLTFExporter embeds canvases via toDataURL). Downscaling happens at
 * load so the exported GLB carries exactly the resolution the recipe
 * asked for - ambientcg bark ships at 1K per map, which would dominate
 * the GLB size budget at native size.
 */
async function loadScaledTexture(url, targetSize, { srgb = false } = {}) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`texture fetch failed: ${url} (${res.status})`);
    const bitmap = await createImageBitmap(await res.blob());
    const size = targetSize ?? bitmap.width;
    const cnv = document.createElement('canvas');
    cnv.width = size;
    cnv.height = size;
    const ctx = cnv.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(bitmap, 0, 0, size, size);
    bitmap.close();
    const tex = new THREE.CanvasTexture(cnv);
    if (srgb) tex.colorSpace = THREE.SRGBColorSpace;
    tex.flipY = true;
    return tex;
}

const barkCache = new Map();
/**
 * ambientcg bark PBR set from the ez-tree clone's demo assets.
 * Color + AO + normal only: MeshPhong ignores roughnessMap, and skipping
 * it keeps one full map out of every exported GLB.
 */
async function loadBarkMaps(barkType, targetSize) {
    const key = `${barkType}@${targetSize}`;
    if (barkCache.has(key)) return barkCache.get(key);
    const dir = `${barkType}_1K-JPG`;
    const base = `/ez-tree/src/app/public/textures/bark/${dir}/${dir}`;
    // Not every ambientcg set ships AO (Bark001 doesn't); treat it as optional.
    const maps = {
        color: await loadScaledTexture(`${base}_Color.jpg`, targetSize, { srgb: true }),
        ao: await loadScaledTexture(`${base}_AmbientOcclusion.jpg`, targetSize).catch(() => null),
        normal: await loadScaledTexture(`${base}_NormalGL.jpg`, targetSize),
        roughness: null,
    };
    barkCache.set(key, maps);
    return maps;
}

const leafCache = new Map();
async function loadLeafMap(leafType, targetSize) {
    const key = `${leafType}@${targetSize}`;
    if (leafCache.has(key)) return leafCache.get(key);
    const tex = await loadScaledTexture(
        `/ez-tree/src/app/public/textures/leaves/${leafType}.png`, targetSize, { srgb: true },
    );
    leafCache.set(key, tex);
    return tex;
}

/**
 * Generate a tree, normalize it to a target world-space height (so the
 * existing TerrainBuilder placement code's scale-variance ranges remain
 * unchanged), name child meshes for downstream identification, strip
 * EZ-Tree's runtime-only onBeforeCompile callbacks (SDS owns leaf wind),
 * and export as a binary GLB.
 *
 * Returns base64-encoded GLB bytes. Playwright's page.evaluate doesn't
 * round-trip Uint8Array cleanly — base64 is the lowest-friction transit
 * format; the Node side decodes back to bytes for writeFile.
 */
window.__bakeTree = async function bakeTree(recipe) {
    status.textContent = `Baking ${recipe.name}…`;
    const tree = new Tree();
    tree.loadPreset(recipe.preset);
    if (recipe.seed != null) tree.options.seed = recipe.seed;
    if (recipe.tweaks) applyTweaks(tree.options, recipe.tweaks);
    // Multiplicative scales on the preset's own leaf tuning (the absolute
    // values live in the preset JSON; recipes only nudge them).
    if (recipe.leafCountScale) {
        tree.options.leaves.count = Math.max(1, Math.round(tree.options.leaves.count * recipe.leafCountScale));
    }
    if (recipe.leafSizeScale) {
        tree.options.leaves.size *= recipe.leafSizeScale;
    }

    // Resolve textures from the type identifiers (preset-supplied unless the
    // recipe overrode them). Loaded and downscaled before generate so the
    // material picks them up directly.
    const barkType = recipe.barkType ?? tree.options.bark.type;
    if (tree.options.bark.textured && barkType) {
        tree.options.bark.maps = await loadBarkMaps(barkType, recipe.barkTextureSize ?? 512);
    }
    const leafType = recipe.leafType ?? tree.options.leaves.type;
    if (leafType) {
        tree.options.leaves.map = await loadLeafMap(leafType, recipe.leafTextureSize ?? 512);
    }

    tree.generate();

    // Bake the bark V-repeat into the geometry UVs and clear the texture
    // transform. ez-tree bakes U into UVs already but applies V tiling at
    // runtime via texture.repeat.y = 1/textureScale.y, which GLTFExporter
    // writes as KHR_texture_transform - an extension SDS's bespoke WebGPU
    // node materials (and any plain-uv consumer) never read. Baking it in
    // makes the GLB self-contained: plain uv() sampling is correct
    // everywhere.
    const barkScaleY = tree.options.bark?.textureScale?.y;
    const trunkUv = tree.branchesMesh?.geometry?.getAttribute?.('uv');
    if (trunkUv && Number.isFinite(barkScaleY) && barkScaleY !== 0) {
        for (let i = 0; i < trunkUv.count; i++) trunkUv.setY(i, trunkUv.getY(i) / barkScaleY);
        trunkUv.needsUpdate = true;
        const m = tree.branchesMesh.material;
        for (const key of ['map', 'aoMap', 'normalMap', 'roughnessMap']) {
            const t = m?.[key];
            if (t) { t.repeat.set(1, 1); t.offset.set(0, 0); }
        }
    }

    // Name children so downstream GLB consumers can distinguish trunk
    // from leaves (e.g. for per-mesh shader weights or LOD impostors).
    tree.branchesMesh.name = 'trunk';
    tree.leavesMesh.name = 'leaves';

    // Drop EZ-Tree's runtime onBeforeCompile callbacks. They don't
    // survive the GLB roundtrip anyway, but stripping them locally
    // keeps the exported material lean and makes intent explicit:
    // SDS's _patchTreeWindMaterial owns leaf wind end-to-end. The
    // rounded leaf normals (main-branch improvement) are GEOMETRY
    // normals and ride the export; only the backface-flip skip lives
    // in the shader, mirrored on the SDS side at integration.
    if (tree.leavesMesh.material) tree.leavesMesh.material.onBeforeCompile = undefined;
    if (tree.branchesMesh.material) tree.branchesMesh.material.onBeforeCompile = undefined;

    // Normalize to a target height so the existing placement code's
    // per-tree scale-variance ranges work unchanged. EZ-Tree presets
    // generate at ~30–50m native; SDS expects ~1m baseline.
    tree.updateMatrixWorld(true);
    const bbox = new THREE.Box3().setFromObject(tree);
    const nativeH = Math.max(bbox.max.y - bbox.min.y, 1e-6);
    const targetH = recipe.normalizeHeight ?? 1.0;
    const s = targetH / nativeH;
    tree.scale.setScalar(s);
    // Also drop the tree so its base sits at y=0 (existing GLBs are
    // authored that way; modelBaseYOffset = -minY would otherwise be
    // a large negative number for a tree authored about its centroid).
    tree.position.y = -bbox.min.y * s;
    tree.updateMatrixWorld(true);

    const exporter = new GLTFExporter();
    const arrayBuffer = await new Promise((resolve, reject) => {
        exporter.parse(
            tree,
            (result) => resolve(result),
            reject,
            { binary: true, embedImages: true }
        );
    });

    const u8 = new Uint8Array(arrayBuffer);
    let bin = '';
    const CHUNK = 0x8000;
    for (let i = 0; i < u8.length; i += CHUNK) {
        bin += String.fromCharCode.apply(null, u8.subarray(i, Math.min(i + CHUNK, u8.length)));
    }

    // Useful diagnostics for the Node side log.
    const triCount = tree.triangleCount ?? 'n/a';
    status.textContent = `Baked ${recipe.name} (${u8.length} bytes, ~${triCount} tris)`;
    return {
        bytesB64: btoa(bin),
        triangleCount: triCount,
        nativeHeight: nativeH,
        normalizedHeight: targetH
    };
};

window.__bakeReady = true;
status.textContent = 'EZ-Tree harness ready.';
</script>
</body>
</html>
