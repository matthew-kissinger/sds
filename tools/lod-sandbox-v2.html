<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LOD Sandbox v2 — Cycle 21 Phase 1 measurement harness</title>
<style>
  body { margin: 0; background: #1a1a1a; color: #ddd; font-family: ui-monospace, Menlo, Consolas, monospace; }
  #grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; }
  .pane { position: relative; background: #000; border: 1px solid #333; }
  .pane h2 { position: absolute; top: 4px; left: 8px; margin: 0; font-size: 12px; padding: 2px 8px; background: rgba(0,0,0,0.7); border: 1px solid #444; }
  .pane canvas { display: block; width: 100%; height: 600px; }
  #panel { padding: 12px 16px; background: #111; border-top: 1px solid #333; font-size: 12px; line-height: 1.6; }
  #panel .row { display: grid; grid-template-columns: 130px 1fr; gap: 12px; align-items: center; margin: 4px 0; }
  select, button { background: #2a2a2a; color: #ddd; border: 1px solid #444; padding: 4px 8px; font-family: inherit; font-size: 12px; }
  button { cursor: pointer; }
  button:hover { background: #3a3a3a; }
  button:disabled { opacity: 0.4; cursor: default; }
  .swatch { display: inline-block; width: 14px; height: 14px; border: 1px solid #555; vertical-align: middle; }
  .col-good { color: #6ee07f; }
  .col-mid  { color: #f0c060; }
  .col-bad  { color: #f06060; }
  pre { background: #0a0a0a; border: 1px solid #333; padding: 8px; max-height: 220px; overflow: auto; font-size: 11px; }
  table { border-collapse: collapse; font-size: 11px; }
  th, td { border: 1px solid #333; padding: 2px 6px; }
  th { background: #222; }
</style>
</head>
<body>

<div id="grid">
  <div class="pane"><h2>LOD0 (MeshStandardMaterial)</h2><canvas id="canvasL"></canvas></div>
  <div class="pane"><h2>LOD2 (kiln impostor)</h2><canvas id="canvasI"></canvas></div>
</div>

<div id="panel">
  <div class="row">
    <label>Species</label>
    <select id="speciesSel"><option>tree1</option><option>tree2</option><option>pine</option></select>
  </div>
  <div class="row">
    <label>Atmosphere preset</label>
    <select id="presetSel"></select>
  </div>
  <div class="row">
    <label>Camera mode</label>
    <select id="modeSel">
      <option value="classic">classic (45° pitch)</option>
      <option value="follow">follow (~26° pitch)</option>
      <option value="cinema">cinema (~70° pitch)</option>
    </select>
  </div>
  <div class="row">
    <label>Camera distance (m)</label>
    <select id="distSel"><option>50</option><option>100</option><option>150</option><option selected>200</option><option>250</option></select>
  </div>
  <div class="row">
    <label>Actions</label>
    <span>
      <button id="resampleBtn">Sample (this cell)</button>
      <button id="smokeBtn">Run 12-cell smoke matrix</button>
      <button id="downloadBtn" disabled>Download JSON</button>
    </span>
  </div>
  <div class="row">
    <label>LOD0 sample</label>
    <span id="rgbL">—</span>
  </div>
  <div class="row">
    <label>LOD2 sample</label>
    <span id="rgbI">—</span>
  </div>
  <div class="row">
    <label>Δ (this cell)</label>
    <span id="delta">—</span>
  </div>
  <div class="row">
    <label>Smoke matrix</label>
    <div id="matrixSummary">—</div>
  </div>
  <pre id="json">{}</pre>
</div>

<script type="importmap">
{
  "imports": {
    "three":            "/node_modules/three/build/three.module.js",
    "three/addons/":    "/node_modules/three/examples/jsm/",
    "@three.ez/instanced-mesh": "/node_modules/@three.ez/instanced-mesh/dist/index.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { Atmosphere } from '/js/atmosphere/Atmosphere.js';
import { SKY_PRESETS } from '/js/atmosphere/skyPresets.js';
import { loadKilnImpostor } from '/js/kiln-impostor-material.js';

const TREE_SCALE = 15.0;
const SPECIES = ['tree1', 'tree2', 'pine'];
const SAMPLE_GRID = 5;  // 5×5 = 25 samples per tree
const CANVAS_W = 720;
const CANVAS_H = 600;

// Camera mode → pitch radians (sign convention: + looks down)
const MODE_PITCH = {
  classic: 45 * Math.PI / 180,
  follow:  26 * Math.PI / 180,
  cinema:  70 * Math.PI / 180,
};

// Build per-pane render context. We render LOD0 + LOD2 in two SEPARATE
// scenes/renderers so each can have its own atmosphere snapshot. A shared
// atmosphere preset drives both each frame so direct/indirect terms are
// identical.
function makePane(canvas) {
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.setSize(CANVAS_W, CANVAS_H, false);

  const scene = new THREE.Scene();
  // Default neutral background; atmosphere will replace via sky dome.
  scene.background = new THREE.Color(0x6f8a98);

  const ambient = new THREE.AmbientLight(0xffffff, 0.7 * Math.PI);
  scene.add(ambient);

  const sun = new THREE.DirectionalLight(0xffffff, 1.0);
  sun.position.set(50, 50, 30);
  scene.add(sun);

  // Optional: ground for parity. Tinted dark green so trees pop.
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(400, 400),
    new THREE.MeshStandardMaterial({ color: 0x3a4830, roughness: 1 }),
  );
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  const camera = new THREE.PerspectiveCamera(45, CANVAS_W / CANVAS_H, 0.1, 2000);

  return { renderer, scene, camera, ambient, sun };
}

const paneL = makePane(document.getElementById('canvasL'));
const paneI = makePane(document.getElementById('canvasI'));

// One Atmosphere instance per pane so each scene gets its own sky dome,
// fog, and sun direction. They share preset state externally. The
// SDS Atmosphere class doesn't own its ambient light — the host (SceneManager)
// creates an AmbientLight or HemisphereLight, adds it to the scene, then
// binds via `bindAmbientLight(light)`. Mirror that pattern here so the
// preset switch can drive ambient color + intensity per ToD.
const atmoL = new Atmosphere(paneL.scene, { initialPreset: 'pastoral-noon', enableClouds: false, attachSunLight: true });
const atmoI = new Atmosphere(paneI.scene, { initialPreset: 'pastoral-noon', enableClouds: false, attachSunLight: true });

// Replace the bootstrap sun + ambient with atmosphere-driven ones.
paneL.scene.remove(paneL.sun);
paneI.scene.remove(paneI.sun);
// Bind paneL.ambient + paneI.ambient to their respective atmospheres.
atmoL.bindAmbientLight(paneL.ambient);
atmoI.bindAmbientLight(paneI.ambient);

// --- Tree loading ---
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('/node_modules/three/examples/jsm/libs/draco/');
const gltfLoader = new GLTFLoader();
gltfLoader.setDRACOLoader(dracoLoader);

let lod0Mesh = null;
let imp = null;          // { geometry, material, ... }
let impInstanced = null; // InstancedMesh wrapping imp.geometry/material

async function loadSpecies(species) {
  // Tear down prior LOD0
  if (lod0Mesh) { paneL.scene.remove(lod0Mesh); }
  if (impInstanced) { paneI.scene.remove(impInstanced); }

  // LOD0 — load tree GLB into pane L
  const gltf = await gltfLoader.loadAsync(`/assets/models/trees/${species}.glb`);
  lod0Mesh = gltf.scene;
  lod0Mesh.scale.setScalar(TREE_SCALE);
  lod0Mesh.position.set(0, 0, 0);
  paneL.scene.add(lod0Mesh);

  // LOD2 — load kiln impostor into pane I
  imp = await loadKilnImpostor(`/assets/models/trees/${species}.imposter`);
  if (!imp) throw new Error(`No kiln impostor for ${species}`);
  // Use InstancedMesh with 1 instance so the kiln vertex shader's
  // `instanceMatrix` resolves correctly.
  impInstanced = new THREE.InstancedMesh(imp.geometry, imp.material, 1);
  const m = new THREE.Matrix4().compose(
    new THREE.Vector3(0, 0, 0),
    new THREE.Quaternion(),
    new THREE.Vector3(TREE_SCALE, TREE_SCALE, TREE_SCALE),
  );
  impInstanced.setMatrixAt(0, m);
  impInstanced.instanceMatrix.needsUpdate = true;
  paneI.scene.add(impInstanced);
}

// Drive impostor uniforms each frame from atmosphere — mirrors the
// real-game `setImpostorTint` path (sun + ambient × intensity, ground
// bounce synthesis).
const GROUND_BOUNCE_TILT = new THREE.Color(0.85, 0.70, 0.55);
const GROUND_BOUNCE_SCALE = 0.5;
function pumpImpostorUniforms(atmo) {
  if (!imp?.material) return;
  const sunColor = atmo.sun?.light?.color ?? new THREE.Color(1, 1, 1);
  const sunIntensity = atmo.sun?.light?.intensity ?? 1;
  // SunSystem exposes `getDirection()` returning the unit vec FROM origin
  // TO sun (i.e., the light's "up-toward-sun" axis). The kiln shader expects
  // the SAME convention — see TerrainBuilder.setImpostorTint passing
  // `atmosphere.sun.dirVec`.
  const sunDir = atmo.sun?.getDirection?.() ?? new THREE.Vector3(0.5, 0.7, 0.3).normalize();
  // Atmosphere's ambientLight isn't exposed directly; reuse hemi/sky tint.
  // Fallback: 35% grey × π for irradiance space.
  const ambientColor = atmo.ambientLight?.color ?? new THREE.Color(0.35, 0.35, 0.35);
  const ambientIntensity = atmo.ambientLight?.intensity ?? Math.PI;

  const u = imp.material.uniforms;
  u.uSunColor.value.copy(sunColor).multiplyScalar(sunIntensity);
  u.uSunDirWorld.value.copy(sunDir);
  u.uAmbientColor.value.copy(ambientColor).multiplyScalar(ambientIntensity);
  u.uGroundBounceColor.value
    .copy(ambientColor)
    .multiply(GROUND_BOUNCE_TILT)
    .multiplyScalar(ambientIntensity * GROUND_BOUNCE_SCALE);
}

// --- Camera + distance posing ---
function poseCamera(camera, mode, distance) {
  const pitch = MODE_PITCH[mode];
  // Camera at distance from target (0, ~mid-canopy, 0). In LOD0 a tree
  // bbox-y midpoint is ~0.5 in unscaled terms × TREE_SCALE = 7.5m.
  const targetY = 7.5;
  const horiz = distance * Math.cos(pitch);
  const vert  = distance * Math.sin(pitch);
  camera.position.set(0, targetY + vert, horiz);
  camera.lookAt(0, targetY, 0);
  camera.updateMatrixWorld();
}

// --- Pixel sampling ---
// Returns linear RGB mean across a 5×5 grid centered on the canopy bbox
// projection. readPixels gives sRGB if the renderer outputs sRGB; we
// convert back to linear for color-math (dE2000 needs linear).
function srgbToLinear(c) { return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }

function sampleCanvas(canvas, gl) {
  const W = canvas.width, H = canvas.height;
  // Center 60% × 60% of the canvas — coarse canopy bound.
  const cx = W / 2, cy = H / 2;
  const radiusX = W * 0.20, radiusY = H * 0.30;
  const samples = [];
  for (let i = 0; i < SAMPLE_GRID; i++) {
    for (let j = 0; j < SAMPLE_GRID; j++) {
      const u = (i + 0.5) / SAMPLE_GRID, v = (j + 0.5) / SAMPLE_GRID;
      const x = Math.round(cx + (u - 0.5) * 2 * radiusX);
      const y = Math.round(cy + (v - 0.5) * 2 * radiusY);
      // gl.readPixels y-axis is bottom-up
      const py = H - 1 - y;
      const buf = new Uint8Array(4);
      gl.readPixels(x, py, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, buf);
      const a = buf[3] / 255;
      // Skip if alpha < 0.2 (sky / background reads).
      if (a < 0.2) continue;
      samples.push([
        srgbToLinear(buf[0] / 255),
        srgbToLinear(buf[1] / 255),
        srgbToLinear(buf[2] / 255),
      ]);
    }
  }
  if (samples.length === 0) return null;
  const sum = samples.reduce(
    (acc, s) => [acc[0] + s[0], acc[1] + s[1], acc[2] + s[2]],
    [0, 0, 0],
  );
  return {
    r: sum[0] / samples.length,
    g: sum[1] / samples.length,
    b: sum[2] / samples.length,
    n: samples.length,
  };
}

// --- Color math: dE2000 in OkLab approximation (cheap proxy; close
// enough for relative LOD-vs-LOD0 measurement). For Phase 2 LUT we use
// per-channel linear ratios anyway.
function linearToOklab(r, g, b) {
  // sRGB linear → OKLab via Björn Ottosson's matrices.
  const l = 0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b;
  const m = 0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b;
  const s = 0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b;
  const lp = Math.cbrt(l), mp = Math.cbrt(m), sp = Math.cbrt(s);
  return {
    L: 0.2104542553 * lp + 0.7936177850 * mp - 0.0040720468 * sp,
    a: 1.9779984951 * lp - 2.4285922050 * mp + 0.4505937099 * sp,
    b: 0.0259040371 * lp + 0.7827717662 * mp - 0.8086757660 * sp,
  };
}
// "dE_OK" — Euclidean OKLab distance × 100 to put it in the dE2000-ish range.
function dEOk(p, q) {
  const a = linearToOklab(p.r, p.g, p.b);
  const b = linearToOklab(q.r, q.g, q.b);
  return Math.hypot(a.L - b.L, a.a - b.a, a.b - b.b) * 100;
}

// --- Wire UI ---
const $ = (id) => document.getElementById(id);
const presetNames = Object.keys(SKY_PRESETS);
for (const name of presetNames) {
  const opt = document.createElement('option');
  opt.value = name; opt.textContent = name;
  if (name === 'pastoral-noon') opt.selected = true;
  $('presetSel').appendChild(opt);
}

let currentPreset = 'pastoral-noon';
let currentSpecies = 'tree1';
let currentMode = 'classic';
let currentDistance = 200;
const matrixResults = [];

function applyPreset(name) {
  atmoL.applyPreset(name);
  atmoI.applyPreset(name);
  currentPreset = name;
}

function reposeAll() {
  poseCamera(paneL.camera, currentMode, currentDistance);
  poseCamera(paneI.camera, currentMode, currentDistance);
}

function renderBoth() {
  pumpImpostorUniforms(atmoI);
  // Atmosphere needs `update(dt)` for time-driven shaders (none active here).
  atmoL.update?.(0.016); atmoI.update?.(0.016);
  paneL.renderer.render(paneL.scene, paneL.camera);
  paneI.renderer.render(paneI.scene, paneI.camera);
}

function sampleCell() {
  renderBoth();
  // Force GL read after render (preserveDrawingBuffer = true above).
  const sL = sampleCanvas(paneL.renderer.domElement, paneL.renderer.getContext());
  const sI = sampleCanvas(paneI.renderer.domElement, paneI.renderer.getContext());
  if (!sL || !sI) {
    return { error: 'no-samples' };
  }
  const dE = dEOk(sL, sI);
  const dRGB = {
    r: sI.r - sL.r,
    g: sI.g - sL.g,
    b: sI.b - sL.b,
  };
  // Rec601 luma in linear (proxy)
  const lumL = 0.2126 * sL.r + 0.7152 * sL.g + 0.0722 * sL.b;
  const lumI = 0.2126 * sI.r + 0.7152 * sI.g + 0.0722 * sI.b;
  const dLuma = lumI - lumL;
  const cell = {
    species: currentSpecies, preset: currentPreset, mode: currentMode, distance: currentDistance,
    lod0: sL, lod2: sI, dE, dRGB, dLuma,
  };
  return cell;
}

function fmtRgb(s) {
  if (!s) return '—';
  return `R ${s.r.toFixed(3)}  G ${s.g.toFixed(3)}  B ${s.b.toFixed(3)}  (n=${s.n})`;
}
function colorClass(dE) {
  if (dE < 5)  return 'col-good';
  if (dE < 10) return 'col-mid';
  return 'col-bad';
}

async function loadAndApply() {
  await loadSpecies(currentSpecies);
  applyPreset(currentPreset);
  reposeAll();
  // Render a couple of frames to let atmosphere settle.
  for (let i = 0; i < 3; i++) renderBoth();
}

$('speciesSel').addEventListener('change', async () => { currentSpecies = $('speciesSel').value; await loadAndApply(); });
$('presetSel').addEventListener('change', () => { applyPreset($('presetSel').value); reposeAll(); renderBoth(); });
$('modeSel').addEventListener('change', () => { currentMode = $('modeSel').value; reposeAll(); renderBoth(); });
$('distSel').addEventListener('change', () => { currentDistance = parseInt($('distSel').value, 10); reposeAll(); renderBoth(); });

$('resampleBtn').addEventListener('click', () => {
  const c = sampleCell();
  if (c.error) { $('json').textContent = JSON.stringify(c); return; }
  $('rgbL').textContent = fmtRgb(c.lod0);
  $('rgbI').textContent = fmtRgb(c.lod2);
  $('delta').innerHTML = `<span class="${colorClass(c.dE)}">dE_OK ${c.dE.toFixed(2)}</span>  dRGB ${c.dRGB.r.toFixed(3)},${c.dRGB.g.toFixed(3)},${c.dRGB.b.toFixed(3)}  dLuma ${c.dLuma.toFixed(3)}`;
  $('json').textContent = JSON.stringify(c, null, 2);
});

// Smoke matrix: 1 scene (current preset) × 1 mode × 4 distances × 3 species = 12 cells.
$('smokeBtn').addEventListener('click', async () => {
  matrixResults.length = 0;
  $('matrixSummary').textContent = 'running…';
  const distances = [50, 100, 150, 250];
  const species = SPECIES;
  for (const sp of species) {
    currentSpecies = sp;
    $('speciesSel').value = sp;
    await loadSpecies(sp);
    applyPreset(currentPreset);
    for (const d of distances) {
      currentDistance = d;
      $('distSel').value = String(d);
      reposeAll();
      // Let atmosphere + render settle for a few frames before sampling.
      for (let i = 0; i < 4; i++) renderBoth();
      const c = sampleCell();
      if (!c.error) matrixResults.push(c);
      await new Promise(r => setTimeout(r, 50));
    }
  }
  // Aggregate
  const meanDE = matrixResults.reduce((a, c) => a + c.dE, 0) / matrixResults.length;
  const maxDE = Math.max(...matrixResults.map(c => c.dE));
  const meanDLuma = matrixResults.reduce((a, c) => a + c.dLuma, 0) / matrixResults.length;
  // dRGB residual signs (how often is impostor more R/G/B than LOD0 across cells?)
  const drgbMean = ['r', 'g', 'b'].map(k =>
    matrixResults.reduce((a, c) => a + c.dRGB[k], 0) / matrixResults.length,
  );
  const summary = {
    cells: matrixResults.length,
    meanDE: meanDE.toFixed(2),
    maxDE: maxDE.toFixed(2),
    meanDLuma: meanDLuma.toFixed(3),
    meanDRGB: drgbMean.map(v => v.toFixed(3)),
  };
  $('matrixSummary').innerHTML = `cells=${summary.cells}  meanDE=<span class="${colorClass(meanDE)}">${summary.meanDE}</span>  maxDE=<span class="${colorClass(maxDE)}">${summary.maxDE}</span>  meanDLuma=${summary.meanDLuma}  meanDRGB=${summary.meanDRGB.join(', ')}`;
  $('json').textContent = JSON.stringify({ summary, cells: matrixResults }, null, 2);
  $('downloadBtn').disabled = false;
});

$('downloadBtn').addEventListener('click', () => {
  const summary = JSON.parse($('json').textContent);
  const blob = new Blob([JSON.stringify(summary, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `lod-sandbox-${currentPreset}-${currentMode}-smoke.json`;
  a.click();
  URL.revokeObjectURL(url);
});

// Boot
await loadAndApply();
$('resampleBtn').click();

// Animate (smooth re-rendering for visual debugging — sampling is on demand).
function animate() {
  requestAnimationFrame(animate);
  renderBoth();
}
animate();

// Expose for live introspection / e2e harness
window.__sandbox = {
  paneL, paneI, atmoL, atmoI,
  loadSpecies, applyPreset, sampleCell,
  get matrixResults() { return matrixResults; },
};

</script>

</body>
</html>
