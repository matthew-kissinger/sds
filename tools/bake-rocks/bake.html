<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SDS bake-rocks harness</title>
<style>body { font-family: sans-serif; padding: 1rem; color: #ccc; background: #1a1a1a; }</style>
</head>
<body>
<h1>SDS bake-rocks</h1>
<p id="status">Loading three.js…</p>
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/",
    "simplex-noise": "/node_modules/simplex-noise/dist/esm/simplex-noise.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { createNoise3D } from 'simplex-noise';

const status = document.getElementById('status');

/**
 * Tiny seedable RNG (Mulberry32) — `simplex-noise@4`'s factory takes a
 * `() => number` random source, so we pass it a deterministic LCG-ish
 * stream. Identical seed === identical noise field === byte-stable bake.
 */
function mulberry32(seed) {
    let s = seed >>> 0;
    return function() {
        s = (s + 0x6d2b79f5) >>> 0;
        let t = s;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

/**
 * Build, displace, and export one rock GLB.
 *
 * Pipeline:
 *   1. IcosahedronGeometry(radius, detail) — uniform sphere of tris.
 *   2. Two-octave 3D simplex noise displaces each vertex along its
 *      outward normal (vertex direction == normal for a sphere).
 *   3. Non-uniform xyz scale squashes/elongates for silhouette variety.
 *   4. Per-vertex AO baked into vertex colors via Y-position relative
 *      to bbox: top = 1.0 (lit), bottom = ~0.55 (in shadow). Reads as
 *      ambient occlusion under sky lighting without any texture.
 *   5. toNonIndexed() + computeVertexNormals() so flatShading can
 *      assign distinct normals per face — gives the chunky low-poly
 *      look that matches the rest of the SDS aesthetic.
 *   6. GLTFExporter binary, base64-encoded for transit back to Node.
 */
window.__bakeRock = async function bakeRock(recipe) {
    status.textContent = `Baking ${recipe.name}…`;

    const geom = new THREE.IcosahedronGeometry(recipe.radius, recipe.detail);
    const noise = createNoise3D(mulberry32(recipe.seed));

    // Displace each vertex along its outward normal. Two octaves: low
    // frequency for primary lump shape, high frequency for facet
    // break-up. Weighted blend keeps the silhouette readable.
    const positions = geom.attributes.position;
    const v = new THREE.Vector3();
    const n = new THREE.Vector3();
    for (let i = 0; i < positions.count; i++) {
        v.fromBufferAttribute(positions, i);
        n.copy(v).normalize();
        const f1 = recipe.noise.freq1;
        const f2 = recipe.noise.freq2;
        const w2 = recipe.noise.weight2;
        const oct1 = noise(n.x * f1, n.y * f1, n.z * f1);
        const oct2 = noise(n.x * f2, n.y * f2, n.z * f2);
        const d = oct1 * (1 - w2) + oct2 * w2;
        v.addScaledVector(n, d * recipe.displacementAmp);
        // Apply non-uniform scale here in geometry-space so the
        // exported GLB's transform is identity — TerrainBuilder
        // bakes child transforms anyway, but identity is cleaner.
        v.x *= recipe.scale.x;
        v.y *= recipe.scale.y;
        v.z *= recipe.scale.z;
        positions.setXYZ(i, v.x, v.y, v.z);
    }
    positions.needsUpdate = true;

    // Recompute bbox after displacement; we'll need it for AO + height
    // normalization.
    geom.computeBoundingBox();
    const bb = geom.boundingBox;
    const height = bb.max.y - bb.min.y;

    // Normalize so native height matches the recipe's targetHeight.
    // TerrainBuilder applies its own ROCK_NATIVE_HEIGHT normalization
    // at load time; matching it here makes that a no-op (cleaner) and
    // keeps the existing rock placement scale ranges working unchanged.
    const sNorm = recipe.targetHeight / Math.max(height, 1e-6);
    for (let i = 0; i < positions.count; i++) {
        v.fromBufferAttribute(positions, i);
        v.multiplyScalar(sNorm);
        positions.setXYZ(i, v.x, v.y, v.z);
    }
    positions.needsUpdate = true;
    geom.computeBoundingBox();
    const finalBb = geom.boundingBox;
    const finalHeight = finalBb.max.y - finalBb.min.y;

    // toNonIndexed first — flatShading needs unique vertices per face
    // so each face can compute its own face-normal. Computing vertex
    // colors AFTER toNonIndexed means each per-face vertex carries
    // the AO of its position (faces get smooth gradients across the
    // rock, no banding).
    let nonIndexed = geom.toNonIndexed();
    nonIndexed.computeVertexNormals();

    // Per-vertex AO baked into vertex colors. Y-based gradient: top
    // bright (sky-lit), bottom dark (ambient shadow). Reads as a
    // gentle natural occlusion without any baked texture lookup.
    const aoMin = 0.55;
    const aoMax = 1.00;
    const yMin = finalBb.min.y;
    const yRange = Math.max(finalBb.max.y - yMin, 1e-6);
    const aoPositions = nonIndexed.attributes.position;
    const colors = new Float32Array(aoPositions.count * 3);
    const baseColor = new THREE.Color(recipe.color);
    for (let i = 0; i < aoPositions.count; i++) {
        const py = aoPositions.getY(i);
        const t = (py - yMin) / yRange;        // 0 = bottom, 1 = top
        const ao = aoMin + (aoMax - aoMin) * t;
        colors[i * 3 + 0] = baseColor.r * ao;
        colors[i * 3 + 1] = baseColor.g * ao;
        colors[i * 3 + 2] = baseColor.b * ao;
    }
    nonIndexed.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    // Material: vertex colors carry the per-vertex AO * base color, so
    // the material itself is white (acts as multiplier identity).
    // flatShading: true to get the faceted low-poly silhouette that
    // matches sheep/dog/terrain. roughness near 1 — rocks aren't shiny.
    const mat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        vertexColors: true,
        roughness: 0.95,
        metalness: 0.0,
        flatShading: true
    });

    const mesh = new THREE.Mesh(nonIndexed, mat);
    mesh.name = 'rock';
    // Sit the rock so its base is at y=0. TerrainBuilder's per-tree
    // ground-ref pattern will then capture modelBaseYOffset = 0 (base
    // at y=0 already), making the loader code a no-op for rocks.
    mesh.position.y = -finalBb.min.y;
    mesh.updateMatrixWorld(true);

    const exporter = new GLTFExporter();
    const arrayBuffer = await new Promise((resolve, reject) => {
        exporter.parse(
            mesh,
            (result) => resolve(result),
            reject,
            { binary: true, embedImages: false }
        );
    });

    const u8 = new Uint8Array(arrayBuffer);
    let bin = '';
    const CHUNK = 0x8000;
    for (let i = 0; i < u8.length; i += CHUNK) {
        bin += String.fromCharCode.apply(null, u8.subarray(i, Math.min(i + CHUNK, u8.length)));
    }

    // Triangles = vertex_count / 3 because we toNonIndexed() above.
    const triangleCount = aoPositions.count / 3;
    status.textContent = `Baked ${recipe.name} (${u8.length} bytes, ${triangleCount} tris)`;
    return {
        bytesB64: btoa(bin),
        triangleCount,
        height: finalHeight
    };
};

window.__bakeReady = true;
status.textContent = 'rock harness ready.';
</script>
</body>
</html>
