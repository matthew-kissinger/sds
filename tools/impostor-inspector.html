<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Cycle 20 — Kiln Impostor Inspector</title>
<style>
  body {
    margin: 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #1a1a1a;
    color: #ddd;
  }
  header {
    padding: 12px 20px;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  h1 { margin: 0; font-size: 15px; font-weight: 600; }
  select, input {
    background: #2a2a2a;
    color: #ddd;
    border: 1px solid #444;
    padding: 4px 8px;
    font-family: inherit;
    font-size: 13px;
  }
  .layout {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
    padding: 20px;
  }
  .panel { background: #222; border: 1px solid #333; padding: 12px; }
  .panel h2 {
    margin: 0 0 8px 0; font-size: 13px; font-weight: 600;
    color: #aaa; text-transform: uppercase; letter-spacing: 0.5px;
  }
  canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; background: #111; }
  .meta {
    margin-top: 16px; padding: 12px 20px; background: #111;
    border-top: 1px solid #333; font-size: 12px; color: #999;
    white-space: pre-wrap; word-break: break-all;
  }
  .swatch-bg-checker {
    background-image:
      linear-gradient(45deg, #2a2a2a 25%, transparent 25%),
      linear-gradient(-45deg, #2a2a2a 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #2a2a2a 75%),
      linear-gradient(-45deg, transparent 75%, #2a2a2a 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, 8px 0;
  }
  label { font-size: 12px; color: #999; }
</style>
</head>
<body>
<header>
  <h1>Kiln Impostor Inspector</h1>
  <label>Tree:
    <select id="tree">
      <option value="tree1">tree1</option>
      <option value="tree2">tree2</option>
    </select>
  </label>
  <label><input type="checkbox" id="labels" checked /> Tile labels</label>
  <label><input type="checkbox" id="grid" checked /> Tile grid</label>
  <label>Path prefix:
    <input id="prefix" value="../assets/models/trees/" size="32" />
  </label>
</header>

<div class="layout">
  <div class="panel">
    <h2>albedo (baseColor)</h2>
    <canvas id="cAlbedo" class="swatch-bg-checker"></canvas>
  </div>
  <div class="panel">
    <h2>normal (capture-view)</h2>
    <canvas id="cNormal" class="swatch-bg-checker"></canvas>
  </div>
  <div class="panel">
    <h2>depth</h2>
    <canvas id="cDepth" class="swatch-bg-checker"></canvas>
  </div>
</div>

<pre class="meta" id="meta">loading…</pre>

<script>
  const $ = (id) => document.getElementById(id);
  const treeSel = $('tree');
  const labels = $('labels');
  const grid = $('grid');
  const prefix = $('prefix');
  const meta = $('meta');

  const canvases = { albedo: $('cAlbedo'), normal: $('cNormal'), depth: $('cDepth') };

  async function loadAll() {
    const name = treeSel.value;
    const base = `${prefix.value}${name}.imposter`;
    const sidecarUrl = `${base}.json`;
    let m;
    try {
      m = await (await fetch(sidecarUrl)).json();
    } catch (err) {
      meta.textContent = `failed to load sidecar at ${sidecarUrl}\n${err}`;
      return;
    }

    const sources = {
      albedo: `${base}.png`,
      normal: `${base}.normal.png`,
      depth:  `${base}.depth.png`,
    };

    await Promise.all(Object.entries(sources).map(async ([layer, url]) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error(url)); img.src = url; });
      drawAtlas(canvases[layer], img, m);
    }));

    meta.textContent = JSON.stringify(m, null, 2);
  }

  function drawAtlas(canvas, img, m) {
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);

    if (grid.checked) {
      ctx.strokeStyle = 'rgba(80, 200, 255, 0.4)';
      ctx.lineWidth = 2;
      for (let i = 1; i < m.tilesX; i++) {
        const x = i * m.tileSize;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let j = 1; j < m.tilesY; j++) {
        const y = j * m.tileSize;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }
    }

    if (labels.checked) {
      ctx.font = `${Math.floor(m.tileSize / 24)}px ui-monospace, monospace`;
      ctx.textBaseline = 'top';
      for (let j = 0; j < m.tilesY; j++) {
        const elDeg = (m.elevations[j] * 180 / Math.PI).toFixed(0);
        for (let i = 0; i < m.tilesX; i++) {
          const azDeg = (m.azimuths[i] * 180 / Math.PI).toFixed(0);
          const x = i * m.tileSize + 8;
          const y = j * m.tileSize + 8;
          const label = `(${i},${j}) az=${azDeg}° el=${elDeg}°`;
          ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
          const w = ctx.measureText(label).width + 12;
          const h = Math.floor(m.tileSize / 16);
          ctx.fillRect(x - 4, y - 4, w, h);
          ctx.fillStyle = '#ffd76b';
          ctx.fillText(label, x, y);
        }
      }
    }
  }

  treeSel.addEventListener('change', loadAll);
  labels.addEventListener('change', loadAll);
  grid.addEventListener('change', loadAll);
  prefix.addEventListener('change', loadAll);
  loadAll();
</script>
</body>
</html>
