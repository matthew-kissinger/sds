<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SDS bake-fence harness</title>
<style>body { font-family: sans-serif; padding: 1rem; color: #ccc; background: #1a1a1a; }</style>
</head>
<body>
<h1>SDS bake-fence</h1>
<p id="status">Loading three.js…</p>
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { buildFenceKit } from '/tools/bake-fence/kitPieces.mjs';

const status = document.getElementById('status');

/**
 * Assemble the fence kit and export it as one binary GLB.
 *
 * The geometry itself is authored in `kitPieces.mjs`, which is pure JS with no
 * three.js dependency, so it can also be measured in Node and asserted in a
 * vitest spec without a browser. This file does only what actually needs
 * three: wrap the buffers in `BufferGeometry`, build the node graph that
 * `js/FencePresets.js` looks pieces up in, and run `GLTFExporter`.
 *
 * That split is deliberate. The exporter is the reason to be in a browser at
 * all: it is the same code path the runtime `GLTFLoader` reads back, so a
 * geometry the exporter is happy with is one the game can load. Everything
 * else (palette texture, Draco, meshopt) happens in Node, where the bytes are.
 *
 * The material carries NO map here. `tools/bake-fence.mjs` attaches the shared
 * 32x4 palette image verbatim from the shipped kit afterwards, which is how the
 * hues are guaranteed not to drift: re-encoding a PNG through a canvas would
 * produce different bytes for the same colours.
 */
window.__bakeFenceKit = async function bakeFenceKit() {
    status.textContent = 'Building fence kit…';

    // One material for the whole kit. The 32x4 palette is the whole point of
    // the shared-texture kit (see tools/merge-fence-kit.mjs); do not let a
    // piece grow its own.
    const material = new THREE.MeshStandardMaterial({
        name: 'PaletteMaterial001',
        color: 0xffffff,
        vertexColors: true,
        roughness: 0.88,
        metalness: 0.0,
    });

    const scene = new THREE.Scene();
    scene.name = 'PastoralFenceKit';
    // The shipped kit nests its four wrappers under one identity group of the
    // same name. FencePresets finds pieces with getObjectByName, so the depth
    // is not load-bearing, but matching it keeps a diff of the two kits honest.
    const kitRoot = new THREE.Group();
    kitRoot.name = 'PastoralFenceKit';
    scene.add(kitRoot);

    const report = [];
    for (const piece of buildFenceKit()) {
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.BufferAttribute(piece.geometry.positions, 3));
        geometry.setAttribute('normal', new THREE.BufferAttribute(piece.geometry.normals, 3));
        geometry.setAttribute('uv', new THREE.BufferAttribute(piece.geometry.uvs, 2));
        geometry.setAttribute('color', new THREE.BufferAttribute(piece.geometry.colors, 3));
        geometry.setIndex(new THREE.BufferAttribute(piece.geometry.indices, 1));
        geometry.computeBoundingBox();
        geometry.computeBoundingSphere();

        const mesh = new THREE.Mesh(geometry, material);
        mesh.name = piece.mesh;
        // Identity wrapper, exactly as the shipped kit ships it: FencePresets
        // clones the WRAPPER, and StructureBuilder's instanced path folds the
        // wrapper-to-mesh matrix in via _getSingleMeshSource().localMatrix.
        const wrapper = new THREE.Group();
        wrapper.name = piece.node;
        wrapper.add(mesh);
        kitRoot.add(wrapper);

        report.push({ node: piece.node, mesh: piece.mesh, ...piece.stats });
    }

    scene.updateMatrixWorld(true);
    status.textContent = 'Exporting GLB…';

    const exporter = new GLTFExporter();
    const arrayBuffer = await new Promise((resolve, reject) => {
        exporter.parse(scene, resolve, reject, { binary: true, embedImages: false });
    });

    const u8 = new Uint8Array(arrayBuffer);
    let bin = '';
    const CHUNK = 0x8000;
    for (let i = 0; i < u8.length; i += CHUNK) {
        bin += String.fromCharCode.apply(null, u8.subarray(i, Math.min(i + CHUNK, u8.length)));
    }

    status.textContent = `Baked fence kit (${u8.length} bytes, ${report.length} pieces)`;
    return { bytesB64: btoa(bin), report };
};

window.__bakeReady = true;
status.textContent = 'fence harness ready.';
</script>
</body>
</html>
