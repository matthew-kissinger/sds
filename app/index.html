    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["VideoGame", "WebApplication"],
        "name": "Sheepdog Sim",
        "@id": "https://sheepdogsim.com/#game",
        "url": "https://sheepdogsim.com/",
        "image": "https://sheepdogsim.com/og/sheepdog-sim.png",
        "description": "Play a free browser herding game and guide 25, 75 or 200 sheep through one field.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Web browser",
        "browserRequirements": "Requires JavaScript and WebGL2 or WebGPU",
        "playMode": "https://schema.org/SinglePlayer",
        "inLanguage": "en",
        "genre": ["Simulation", "Herding"],
        "gamePlatform": ["Web browser", "Desktop", "Mobile"],
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "author": {
          "@type": "Person",
          "name": "Matthew Kissinger",
          "url": "https://github.com/matthew-kissinger"
        },
        "sameAs": "https://github.com/matthew-kissinger/sds",
        "license": "https://www.gnu.org/licenses/agpl-3.0.html"
      }
    </script>
    <style>
      /* Pre-React first paint. UiStyles owns the same paper tone after mount. */
      html, body, #root { margin: 0; height: 100%; overflow: hidden; background: #eadfca; }
      canvas { display: block; touch-action: none; }
      .static-shell { box-sizing: border-box; width: 100%; height: 100%; display: grid; place-items: center; padding: 24px; color: #2c3828; font: 14px/1.5 system-ui, sans-serif; text-align: center; }
      .static-shell__card { width: min(88vw, 440px); box-sizing: border-box; padding: 32px; border: 1px solid rgba(78,65,46,.2); border-radius: 32px; background: rgba(244,234,215,.72); box-shadow: 0 18px 70px rgba(65,51,34,.12); }
      .static-shell h1 { margin: 0 0 10px; font: 400 48px/1 Georgia, serif; letter-spacing: .035em; }
      .static-shell p { margin: 0; color: #596052; letter-spacing: .12em; text-transform: uppercase; }
      .static-shell .static-shell__description { margin: 16px 0; letter-spacing: normal; text-transform: none; }
      .static-shell nav { display: flex; justify-content: center; gap: 20px; }
      .static-shell a { color: #365f44; text-underline-offset: 3px; }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="static-shell">
        <section class="static-shell__card" aria-label="Loading Sheepdog Sim">
          <h1>Sheepdog Sim</h1>
          <p>Loading game code</p>
          <p class="static-shell__description">A free sheep herding game in your browser. Move, sprint and bark as a sheepdog to guide 25, 75 or 200 sheep into the pen.</p>
          <noscript><p class="static-shell__description">Enable JavaScript to play. The game information and controls below are available without it.</p></noscript>
          <nav aria-label="Game information"><a href="/about">About the game</a><a href="/support">How to play</a></nav>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
