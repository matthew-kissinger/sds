    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["VideoGame", "WebApplication"],
        "name": "Sheepdog Sim",
        "url": "https://sheepdogsim.com/",
        "image": "https://sheepdogsim.com/og/sheepdog-sim.png",

        "operatingSystem": "Any modern desktop or mobile web browser",
        "browserRequirements": "Requires JavaScript and WebGL2 or WebGPU",

    <style>
      /* Pre-React first paint. UiStyles owns the same paper tone after mount. */
      html, body, #root { margin: 0; height: 100%; overflow: hidden; background: #eadfca; }
      canvas { display: block; touch-action: none; }
      .static-shell { box-sizing: border-box; padding: 32px; color: #2c3828; font: 18px/1.5 system-ui, sans-serif; }
      .static-shell h1 { margin: 0 0 8px; font: 700 42px/1.05 Georgia, serif; }
      .static-shell a { color: inherit; }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="static-shell">
        <h1>Sheepdog Sim</h1>
        <p>One dog, one flock and one field. Guide every sheep through the gate.</p>
        <p><a href="/about">About</a> · <a href="/support">Controls and support</a></p>
      </main>
    </div>
    <noscript>Sheepdog Sim requires JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
