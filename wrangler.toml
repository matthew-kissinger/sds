# The one Wrangler configuration, at the repository root. The Cloudflare Vite
# plugin (vite.config.ts) reads it to build the Worker beside the client and to
# serve both in `vite dev`; wrangler deploys what the build generates from it.
# docs/operations/deployment.md explains the handoff.
name = "sds-worker"
main = "worker/src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

# Explicit, never inferred. Cloudflare infers workers_dev = false as soon as a
# config declares routes, and sds-worker.matt-m-kissinger.workers.dev must keep
# answering: every client built before Release 1 has it baked in as the score
# API (the old PROD_SCORE_API_BASE), and an open tab keeps calling it.
workers_dev = true
# Version preview URLs of production would serve production's D1 and secrets
# from a throwaway hostname. Pull-request previews use env.preview instead.
preview_urls = false

# The game. There is no `directory` here on purpose: the Vite plugin supplies
# the client build output (dist/, with dist/release.json written into it by the
# releaseManifest plugin in vite.config.ts) when it generates the deploy
# config. Only /api/* runs the Worker script first; every other path is served
# by the asset layer, with index.html for anything unmatched (the array form of
# run_worker_first also stops Sec-Fetch-Mode from deciding that). _headers and
# _redirects from app/public are honoured natively.
[assets]
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Observability
[observability]
enabled = true

# Source-mapped stack traces in Workers observability; the maps are uploaded to
# Cloudflare, not served. The Vite plugin defaults this on; stated here so the
# deploy configuration is not at its mercy.
upload_source_maps = true

# Durable Object class history. The version 2 multiplayer classes were created
# by v1 and retired by v2 in Release 1, which deletes the classes and their
# stored room state. Both entries stay: migrations are an append-only history
# replayed against the tag a script has already applied. They are top-level, so
# they apply to every environment. A class lifecycle change only lands through
# `wrangler deploy`; `wrangler versions upload` refuses it, and no rollback can
# cross it. Multiplayer returns as a separate realtime Worker under
# spec/03-multiplayer.md.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO", "LobbyDO"]

[[migrations]]
tag = "v2"
deleted_classes = ["RoomDO", "LobbyDO"]

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "sds-db"
database_id = "513aa937-e60a-4fb6-b499-9f3814149e88"

# sheepdogsim.com is served by this Worker through a route, not a Custom
# Domain. A route takes precedence over the sds-frontend Pages custom domain on
# the same hostname, so it took over with no downtime and the Pages project sits
# untouched underneath; deleting the route is the rollback. Only a Custom Domain
# would force the hostname off Pages first. www.sheepdogsim.com is not a route:
# a proxied DNS record and a Single Redirect rule send it to the apex at the
# zone edge, before assets or this Worker (docs/operations/deployment.md).
#
# /r/* is deliberately left to a future, more specific route: route matching is
# most-specific first, so a realtime Worker can claim sheepdogsim.com/r/*
# without touching this one (spec/03-multiplayer.md).
#
# A deploy PUTs exactly this list, replacing any other route on this script.
# A config with no routes leaves existing routes alone, so removing this block
# does not remove the route; see docs/operations/deployment.md for rollback.
[[routes]]
pattern = "sheepdogsim.com/*"
zone_name = "sheepdogsim.com"

# ---------------------------------------------------------------------------
# Per-pull-request preview environment. Built with CLOUDFLARE_ENV=preview and
# uploaded by .github/workflows/preview.yml as sds-worker-preview, with its OWN
# D1 so a preview can never touch the production leaderboard. A database id is
# an identifier, not a secret, so it is committed;
# scripts/d1-migrate-remote.mjs refuses to run a preview migration against the
# production id. Its JWT_SECRET is a Worker secret set once with
#   npx wrangler secret put JWT_SECRET --env preview
# Environments do not inherit bindings, so D1 is redeclared here. The Durable
# Object [[migrations]] history above is top-level and shared.
# ---------------------------------------------------------------------------
[env.preview]
name = "sds-worker-preview"
# Each pull request uploads a version here with --preview-alias pr-<number>, so
# its build answers on pr-<number>-sds-worker-preview.matt-m-kissinger.workers.dev
# against this environment's own D1 and JWT_SECRET. Assets are inherited.
workers_dev = true
preview_urls = true
# routes is inheritable in Wrangler 4: without this line a preview deploy would
# try to claim sheepdogsim.com/* for sds-worker-preview.
routes = []

[[env.preview.d1_databases]]
binding = "DB"
database_name = "sds-db-preview"
database_id = "6d5b0fce-952f-4d94-8936-b51fc559496c"
